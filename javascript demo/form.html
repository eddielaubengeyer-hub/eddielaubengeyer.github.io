<!DOCTYPE html>

<html>

<head>

    <script>

        function calculateWage() {

            var hours =
            document.getElementById("hours").value;

            var payRate =
            document.getElementById("payRate").value;

            var wage = hours * payRate;

            document.getElementById("wage").value = wage;

        }

    </script>

</head>

<body>

    <span>

        <a href="index.html">Home</a> |

        <a href="bulb.html">Bulb</a> |

        <a href="form.html">Form</a>

    </span>

    <br>


    <h2>Wage Calculator</h2>


    <form>


        <label for="hours">Hours:</label>

        <br>

        <input type="text"
               id="hours"
               name="hours"
               value="">

        <br>


        <label for="payRate">Pay Rate:</label>

        <br>

        <input type="text"
               id="payRate"
               name="payRate"
               value="">

        <br>


        <label for="wage">Wage:</label>

        <br>

        <input type="text"
               id="wage"
               name="wage"
               value=""
               disabled>

        <br>

        <br>


        <input type="button"
               value="Click Here to Calculate"
               onclick="calculateWage()">


    </form>

</body>

</html>
