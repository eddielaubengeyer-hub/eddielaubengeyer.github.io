        // Variables

        var value1 = 60;

        var sum = value1 + value2;

        document.write(sum + "<br>");

        var string1 = "Chocolate";

        var string2 = " Brownie";

        // Select an HTML element and manipulate it

        document.getElementById("result").innerHTML = "What's up";

        document.getElementById("result").innerText = "Hello";


        // Select an HTML element by ID and change its style

        document.getElementById("result").style =
