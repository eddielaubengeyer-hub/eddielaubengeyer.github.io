<!DOCTYPE html>

<html>

<head>

    <title>My 10 Favorite Items</title>

</head>


<body>


    <h1>My 10 Favorite Items</h1>


    <script>


        var favorites =
        [
            "Coffee",
            "Trucks",
            "Time",
            "Lift Kits",
            "Indian Food",
            "Books",
            "Investing",
            "Travel",
            "Peace",
            "Family"
        ];


        document.write("<ol>");


        for(var counter = 0;
            counter < favorites.length;
            counter++) {


            document.write(
                "<li>" +
                favorites[counter] +
                "</li>"
            );


        }


        document.write("</ol>");


    </script>


</body>

</html>
